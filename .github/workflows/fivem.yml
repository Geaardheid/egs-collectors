name: FiveM servers
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency: { group: fivem, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node collect.mjs
        env:
          EGS_INGEST_TOKEN: ${{ secrets.EGS_INGEST_TOKEN }}
